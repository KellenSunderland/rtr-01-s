areas:
  design_and_conventions:
    description: "Project review guidelines"
    globs:
      - "**"
    rules:
      - id: "g1_0"
        description: "[G1 Composition over inheritance] Do not introduce class inheritance to share behaviour. Prefer composition: hold a collaborator and delegate. Inheritance is acceptable only for genuine *is-a* relationships with a stable abstract interface (e.g. implementing a `Protocol`/interface, a Go interface, an abstract base class with no state)."
        severity: "medium"
      - id: "g1_1"
        description: "[G1 Composition over inheritance] Flag: subclasses that override concrete parent methods to change behaviour; base classes that exist only to share helpers; inheritance depth > 1; mixins carrying state."
        severity: "medium"
      - id: "g2_0"
        description: "[G2 Pragmatic SOLID] **Single responsibility**: a type or function does one thing. Flag functions > ~60 lines that mix I/O, parsing and business logic; types that both manage lifecycle and implement policy."
        severity: "medium"
      - id: "g2_1"
        description: "[G2 Pragmatic SOLID] **Open/closed**: new variants should be added by adding a new implementation of an existing interface, not by adding another `if/else`/`switch` arm on a type tag. Flag growing type switches on an enum/string kind where an interface already exists."
        severity: "medium"
      - id: "g2_2"
        description: "[G2 Pragmatic SOLID] **Liskov**: implementations must honour the documented contract of the interface (no \"not supported\" panics in a method the interface requires, no stricter preconditions)."
        severity: "medium"
      - id: "g2_3"
        description: "[G2 Pragmatic SOLID] **Interface segregation**: pass the narrowest interface a function needs (`io.Reader`, not `*os.File`; a `Protocol` with one method, not the whole service)."
        severity: "medium"
      - id: "g2_4"
        description: "[G2 Pragmatic SOLID] **Dependency inversion**: core logic depends on abstractions (the provider `Protocol`s, Go interfaces, C ABI), never on a concrete provider/SDK/global."
        severity: "medium"
      - id: "g2_5"
        description: "[G2 Pragmatic SOLID] Pragmatic: do not demand abstractions for one-off code; flag only where a second implementation exists or is clearly imminent (providers, stores, transports)."
        severity: "medium"
      - id: "g3_0"
        description: "[G3 Dependency injection] Collaborators (clients, stores, clocks, random sources, providers, loggers) are passed in through constructors/parameters, not created inside the function and not read from globals, module-level singletons, or environment variables deep inside logic."
        severity: "medium"
      - id: "g3_1"
        description: "[G3 Dependency injection] Time and randomness are injected (`clock`, `now()`, `rng`) so code is testable."
        severity: "medium"
      - id: "g3_2"
        description: "[G3 Dependency injection] Flag: `time.Now()`/`datetime.now()`/`Date.now()` inside business logic that has a clock available; `new`/`make_provider`/`os.environ`/`process.env` inside non-constructor code; hidden network calls in constructors."
        severity: "medium"
      - id: "g4_0"
        description: "[G4 Error handling & boundaries] Errors are returned/raised with context, never swallowed (`except Exception: pass`, `_ = err`, empty `catch`). Flag silent error drops and `log-and-continue` on errors that affect correctness."
        severity: "medium"
      - id: "g4_1"
        description: "[G4 Error handling & boundaries] Validate at the boundary (input parsing), trust inside."
        severity: "medium"
      - id: "g5_0"
        description: "[G5 Comment and documentation conventions] Public functions/types have a doc comment stating *what* and *why*, preconditions and units (ms vs ns, normalized vs pixel coordinates)."
        severity: "medium"
      - id: "g5_1"
        description: "[G5 Comment and documentation conventions] Comments describe intent, not mechanics. Flag comments that restate the code (`i += 1  # increment i`), **stale or misleading comments** (comment contradicts the code), commented-out code, `TODO`/`FIXME` without an owner or issue reference, and docstrings whose parameter lists do not match the signature."
        severity: "medium"
      - id: "g5_2"
        description: "[G5 Comment and documentation conventions] Language conventions: Go doc comments start with the identifier name; Python uses Google-style docstrings; TS uses TSDoc `/** */`; C++ public headers use `///` Doxygen style."
        severity: "medium"
      - id: "g6_0"
        description: "[G6 Naming and units] Names carry units and clock domain where relevant (`ts_ms`, `wall_ns`, `retention_s`). Flag unit-less time/size names and mixed clock domains in one expression."
        severity: "medium"
